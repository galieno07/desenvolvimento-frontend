<div class="conteudo-login">
<mat-form-field class="example-form-field">
  <mat-label>E-mail</mat-label>
  <input matInput typr="text" [(ngModel)]="email">
@if (email) {
  <button matSuffix mat-icon-button aria-label="Clear" (click)= "email=''">
    <mat-icon>close</mat-icon>
  </button>
}
</mat-form-field>

<mat-form-field class="example-form-field">
  <mat-label>Password</mat-label>
  <input matInput typr="text" [(ngModel)]="senha">
  @if (senha) {
    <button matSuffix mat-icon-button aria-label="Clear" (click)= "senha=''">
      <mat-icon>person</mat-icon>
    </button>
  }
</mat-form-field>


<button mat-fab extended>
  <mat-icon>person</mat-icon>Login

</button>

</div>
